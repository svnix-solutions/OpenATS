packages:
  - "backend"
  - "frontend"

allowBuilds:
  # Optional native speed-ups for the websocket transport teleproto uses.
  # Pure-JS fallbacks ship with it, so declining the build costs a little
  # throughput on a connection that carries chat messages and nothing else.
  #
  # Said explicitly because pnpm treats an undeclared build script as an error
  # rather than a warning — and then appends its own `name: set this to true or
  # false` placeholders to this file, which duplicate whatever is already here
  # and leave it unparseable. If an install starts failing on "duplicated
  # mapping key", that is what happened.
  bufferutil: false
  "utf-8-validate": false
  es5-ext: false
  core-js: false
  msw: false
  sharp: false
  unrs-resolver: false
  "@scarf/scarf": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  '@google/genai': true

# pnpm 11 reads overrides from here, not from `pnpm.overrides` in package.json,
# which it now ignores with a warning rather than an error — so an override put
# there looks applied and is not.
#
# Both of these are transitive: nothing here depends on them directly.
overrides:
  # postcss (via next) pins <3.3.18, where a custom generator can loop
  # indefinitely. postcss accepts ^3.3.x, so this is in range.
  nanoid: "^3.3.18"
  # A transitive dependency pins 3.3.1. Sixteen advisories against it, all sanitizer
  # bypasses — mutation XSS, FORBID_TAGS bypasses, prototype pollution — which
  # matter more here than the severity label suggests, since this is what
  # sanitizes rich text in an app that handles candidate data.
  dompurify: "^3.4.13"
  # A transitive dependency pins 11.1.0. A patch bump within the same major.
  uuid: "^11.1.1"
