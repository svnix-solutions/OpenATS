name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  # Deploy only runs if the full test suite passes.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Built by the test workflow above, from the commit being deployed.
      - name: Download backend build
        uses: actions/download-artifact@v4.3.0
        with:
          name: backend-dist

      # Split into three steps so the build can be dropped in between. The VM
      # still checks the repo out: migrations, ecosystem.config.js and the
      # lockfile all come from it — only the compiling has moved to CI.
      - name: Sync source and dependencies
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true

            cd /home/azureuser/OpenATS

            # reset --hard, not pull: any local drift on the VM makes a merge
            # abort, which previously left the server on stale code.
            git fetch origin main
            git reset --hard origin/main

            # Single pnpm workspace, so install from the repo root.
            pnpm install --frozen-lockfile

      - name: Copy the build to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend-dist.tar.gz
          target: /tmp

      - name: Migrate and restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true

            cd /home/azureuser/OpenATS

            # Removed rather than unpacked over: leftovers this build no
            # longer produces would survive, and a stale .js beside a deleted
            # .ts is invisible until something imports it.
            #
            # Deliberately here and not in the sync step: between the two, a
            # failed copy would leave the VM with no build at all. The running
            # process would survive on the code already in memory and the next
            # restart — a reboot, an unrelated deploy — would find nothing to
            # start. This way the old build is only dropped once its
            # replacement is on the box.
            rm -rf backend/dist
            tar -xzf /tmp/backend-dist.tar.gz -C backend
            rm -f /tmp/backend-dist.tar.gz

            # Guard against deploying a tarball that unpacked to nothing: the
            # health check below would otherwise be the first thing to notice,
            # after pm2 had already been restarted onto it.
            test -f backend/dist/src/server.js

            pnpm --filter ./backend exec drizzle-kit migrate

            pm2 restart ecosystem.config.js --update-env
            pm2 save

            # Fail the deploy if the app did not come back up.
            sleep 5
            curl -fsS http://localhost:8080/health
