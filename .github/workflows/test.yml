name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openats
          POSTGRES_PASSWORD: openats
          POSTGRES_DB: openats_test
        # 5433 on the runner to match backend/.env.test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Plain image, no flags, so a service container is enough — unlike the
      # identity provider, which takes its configuration as arguments.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter ./backend lint

      - name: Lint frontend
        run: pnpm --filter ./frontend lint

      # The service container starts before the repo is checked out, so its
      # init scripts cannot be mounted. Apply the role here instead.
      - name: Create the application role
        run: |
          PGPASSWORD=openats psql -h localhost -p 5433 -U openats -d openats_test \
            -v ON_ERROR_STOP=1 -f docker/init-app-role.sql

      - name: Apply migrations to the test database
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: postgresql://openats:openats@localhost:5433/openats_test
        run: pnpm drizzle-kit migrate

      - name: Run unit and integration tests
        run: pnpm test

      - name: Type-check end-to-end specs
        run: pnpm exec tsc --noEmit

      # The test files are excluded from the build, so nothing else checks them.
      - name: Type-check backend tests
        working-directory: backend
        run: pnpm exec tsc --noEmit -p tsconfig.test.json

      - name: Build backend
        run: pnpm --filter ./backend build


      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          MIGRATION_DATABASE_URL: postgresql://openats:openats@localhost:5433/openats_test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
