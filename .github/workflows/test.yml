name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # Lets deploy.yml run this suite as a gate before deploying.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openats
          POSTGRES_PASSWORD: openats
          POSTGRES_DB: openats_test
        # 5433 on the runner to match backend/.env.test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Plain image, no flags, so a service container is enough — unlike the
      # identity provider, which takes its configuration as arguments.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter ./backend lint

      - name: Lint frontend
        run: pnpm --filter ./frontend lint

      # The service container starts before the repo is checked out, so its
      # init scripts cannot be mounted. Apply the role here instead.
      - name: Create the application role
        run: |
          PGPASSWORD=openats psql -h localhost -p 5433 -U openats -d openats_test \
            -v ON_ERROR_STOP=1 -f docker/init-app-role.sql

      - name: Apply migrations to the test database
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: postgresql://openats:openats@localhost:5433/openats_test
        run: pnpm drizzle-kit migrate

      - name: Run unit and integration tests
        run: pnpm test

      - name: Type-check end-to-end specs
        run: pnpm exec tsc --noEmit

      # The test files are excluded from the build, so nothing else checks them.
      - name: Type-check backend tests
        working-directory: backend
        run: pnpm exec tsc --noEmit -p tsconfig.test.json

      - name: Build backend
        run: pnpm --filter ./backend build

      # The compiled output is what gets deployed. Building it once here and
      # shipping the result is the point: compiling on the production VM meant
      # the artifact was produced by whatever toolchain that box happened to
      # have, which is how it drifted from what CI had tested.
      #
      # A tarball rather than the directory: scp of a tree needs
      # strip_components to line up, and it leaves files behind that a newer
      # build no longer produces.
      - name: Package backend build
        if: github.event_name == 'push'
        run: tar -czf backend-dist.tar.gz -C backend dist

      - name: Upload backend build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-dist
          path: backend-dist.tar.gz
          retention-days: 7

      # Next resolves routes at build time, and a whole class of errors —
      # ambiguous dynamic segments, invalid page signatures, server/client
      # boundary violations — appears here and nowhere else. Lint and tests
      # both pass on a frontend that cannot build.
      - name: Build frontend
        run: pnpm --filter ./frontend build

      # The E2E suite existed but ran nowhere, so nothing it covered was
      # actually guarded on a pull request.
      #
      # The identity provider is a step rather than a service container
      # because authorizer takes its configuration as flags, and a service
      # container cannot override the command. `--network host` so it reaches
      # the Postgres service on 5433 and the suite reaches it on 8090.
      - name: Start the identity provider
        run: |
          PGPASSWORD=openats psql -h localhost -p 5433 -U openats -d openats_test \
            -c "CREATE DATABASE authorizer"
          openssl genrsa -out /tmp/authz-private.pem 2048
          openssl rsa -in /tmp/authz-private.pem -pubout -out /tmp/authz-public.pem
          docker run -d --name authorizer --network host \
            lakhansamani/authorizer:latest \
              --url=http://localhost:8090 --http-port=8090 \
              --database-type=postgres \
              --database-url="postgresql://openats:openats@localhost:5433/authorizer?sslmode=disable" \
              --admin-secret=ci-admin-secret \
              --encryption-key="$(openssl rand -hex 32)" \
              --client-id=11111111-1111-1111-1111-111111111111 \
              --client-secret="$(openssl rand -hex 24)" \
              --jwt-type=RS256 \
              --jwt-private-key="$(cat /tmp/authz-private.pem)" \
              --jwt-public-key="$(cat /tmp/authz-public.pem)" \
              --roles=super_admin,hiring_manager,interviewer,client_admin,client_reviewer \
              --default-roles=super_admin \
              --disable-mfa --disable-totp-login --disable-email-otp \
              --custom-access-token-script='function(user, tokenPayload){ var d = tokenPayload; d.email = user.email; d.given_name = user.given_name; d.family_name = user.family_name; return d; }' \
              --allowed-origins=http://localhost:3000,http://localhost:8080 \
              --redirect-uris=http://localhost:3000/api/auth/callback \
              --app-cookie-secure=false --admin-cookie-secure=false \
              --app-cookie-same-site=lax
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/.well-known/jwks.json >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8090/.well-known/jwks.json >/dev/null

      # Both packages read their own .env; the E2E run needs the provider's
      # address in both, and the admin secret in the frontend's.
      - name: Point both packages at it
        run: |
          cat >> backend/.env <<'ENVEOF'
          OIDC_JWKS_URL=http://localhost:8090/.well-known/jwks.json
          OIDC_ISSUER=http://localhost:8090
          DATABASE_URL=postgresql://openats_app:openats_app@localhost:5433/openats_test
          MIGRATION_DATABASE_URL=postgresql://openats:openats@localhost:5433/openats_test
          REDIS_URL=redis://localhost:6379
          ENCRYPTION_KEY=BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          FRONTEND_URL=http://localhost:3000
          # Dummy values. The server validates these at boot, and CI
          # deliberately has no secrets — nothing the E2E specs touch calls
          # out to any of them.
          R2_ENDPOINT=http://localhost:9000
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET_NAME=ci
          R2_PUBLIC_URL=http://localhost:9000/ci
          RESEND_API_KEY=re_test_000000000000000000000000
          RESEND_FROM_EMAIL=ci@example.test
          GEMINI_API_KEY=ci-gemini-key
          ENVEOF
          cat >> frontend/.env <<'ENVEOF'
          NEXT_PUBLIC_AUTHORIZER_URL=http://localhost:8090
          NEXT_PUBLIC_AUTHORIZER_CLIENT_ID=11111111-1111-1111-1111-111111111111
          AUTHORIZER_ADMIN_SECRET=ci-admin-secret
          OPENATS_API_URL=http://localhost:8080
          NEXT_PUBLIC_API_URL=http://localhost:8080
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          FRONTEND_URL=http://localhost:3000
          ENVEOF

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          MIGRATION_DATABASE_URL: postgresql://openats:openats@localhost:5433/openats_test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
