name: openats

services:
  postgres:
    image: postgres:17
    container_name: openats-postgres
    environment:
      POSTGRES_USER: openats
      POSTGRES_PASSWORD: openats
      POSTGRES_DB: openats
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openats -d openats"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Catches outgoing mail instead of delivering it, so the offer, rejection
  # and interview emails can be read rather than imagined. Nothing leaves the
  # machine: Mailpit accepts any SMTP conversation and shows it at :8025.
  #
  # This is also how you check what an email actually looks like in a client,
  # which is the part unit tests cannot tell you.
  mailpit:
    image: axllent/mailpit:latest
    container_name: openats-mailpit
    ports:
      - "1025:1025"   # SMTP, what the backend talks to
      - "8025:8025"   # the web inbox
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-test:
    image: postgres:17
    container_name: openats-postgres-test
    environment:
      POSTGRES_USER: openats
      POSTGRES_PASSWORD: openats
      POSTGRES_DB: openats_test
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    tmpfs:
      - /var/lib/postgresql/data

  # ── The application itself ────────────────────────────────────────────────
  #
  # All behind the "app" profile, so `docker compose up -d` still starts only
  # Postgres and Redis, which is what CONTRIBUTING and the test docs assume and
  # what everyone already has muscle memory for.
  #
  #   docker compose --profile app up -d --build
  #
  # Both .env files are still required — nothing here invents configuration.
  # The connection strings are the exception: those in backend/.env point at
  # localhost, which inside a container is the container.

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    env_file: [backend/.env]
    environment:
      # The owner role: migrations create and alter, and drizzle-kit reads
      # this one rather than DATABASE_URL.
      MIGRATION_DATABASE_URL: postgresql://openats:openats@postgres:5432/openats
      DATABASE_URL: postgresql://openats_app:openats_app@postgres:5432/openats
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: [backend/.env]
    environment:
      # openats_app, never the owner: owners bypass row-level security, so the
      # tenancy boundary would be off with every query still working.
      DATABASE_URL: postgresql://openats_app:openats_app@postgres:5432/openats
      REDIS_URL: redis://redis:6379
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    # Same image, different process. Without this running, uploaded CVs queue
    # and are never analysed, and nothing reports an error.
    command: ["node", "dist/src/worker.js"]
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql://openats_app:openats_app@postgres:5432/openats
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Inlined into the bundle at build time, so they are build args rather
        # than environment. Changing one needs a rebuild, not a restart.
        #
        # The bare origin, with no /api: lib/api.ts appends /api itself, the
        # public pages append /public, and lib/socket.ts uses it as the socket
        # origin. Including /api here double-prefixes the dashboard and 404s
        # every candidate-facing page.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTHORIZER_URL: ${NEXT_PUBLIC_AUTHORIZER_URL:-http://localhost:8090}
        NEXT_PUBLIC_AUTHORIZER_CLIENT_ID: ${NEXT_PUBLIC_AUTHORIZER_CLIENT_ID:-}
    env_file: [frontend/.env]
    environment:
      # Server-side calls go container to container; the browser uses
      # NEXT_PUBLIC_API_URL, which was baked in above. Bare origin again —
      # see the note on that build arg.
      OPENATS_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
